<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sorveteria Delícia</title>
    <link rel="stylesheet" href="w3.css">

    <style>
        body {
            margin: 0;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4f1, #ffd8b5, #c6e6ff);
            background-size: 300% 300%;
            animation: fundo 10s ease infinite;
        }

        @keyframes fundo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            max-width: 900px; 
            margin: auto;
            margin-top: 60px;
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            animation: zoom 0.6s;
        }

        @keyframes zoom {
            from { transform: scale(0.9); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 55px;
            color: #ff5faf;
            text-shadow: 
                2px 2px #ffffff,
                4px 4px rgba(0,0,0,0.2);
        }

        p {
            font-size: 20px;
            color: #555;
            margin-top: -10px;
        }

        /* Botão estilizado */
        .btn-ice {
            display: inline-block;
            padding: 18px 35px;
            background: #ff85c2;
            color: white;
            text-decoration: none;
            font-size: 22px;
            border-radius: 15px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-ice:hover {
            background: #ff4fa3;
            transform: scale(1.07);
        }

        footer {
            text-align: center;
            color: white;
            background: #ff5faf;
            padding: 18px;
            margin-top: 60px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1 class="w3-center">
        🍦 Sorveteria Delícia 🍨
    </h1>

    <p class="w3-center">
        Obrigado por visitar nossa sorveteria!<br>
        Clique abaixo para responder nossa pesquisa e nos ajudar a melhorar.
    </p>

    <div class="w3-center" style="margin-top: 35px;">
        <a href="MenuPesquisa.html" class="btn-ice">
            📋 Pesquisa de Opinião
        </a>
    </div>

</div>

<footer>
    Sorveteria Delícia © 2025 — Todos os direitos reservados
    <br>
    <br>
        Desenvolvida por Thamirys Matos e José Danilo!!

</footer>
    
</body>
</html>
