<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pesquisa de Satisfação</title>

    <style>
        /* Fundo colorido estilo sorveteria */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4f1, #ffd8b5, #c6e6ff);
            background-size: 300% 300%;
            animation: fundo 10s ease infinite;
        }

        @keyframes fundo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card central */
        .form-box {
            width: 70%;
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            animation: zoom 0.7s;
        }

        @keyframes zoom {
            from { transform: scale(0.9); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        h1 {
            text-align: center;
            color: #ff5faf;
            font-size: 35px;
            text-shadow: 
                2px 2px #ffffff,
                4px 4px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }

        label, p {
            font-size: 18px;
            font-weight: bold;
            color: #444;
        }

        input[type="text"] {
            width: 95%;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ffb6d9;
            margin-top: 7px;
            margin-bottom: 18px;
            font-size: 16px;
        }

        /* Radios maiores e fofinhos */
        input[type="radio"] {
            transform: scale(1.4);
            margin-right: 8px;
            accent-color: #ff6fb7;
        }

        /* Botão enviar */
        input[type="submit"] {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            color: white;
            background: #ff6fb7;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }

        input[type="submit"]:hover {
            background: #ff3c99;
            transform: scale(1.05);
        }
    </style>

</head>

<body>

    <div class="form-box">

        <h1>🍧 Pesquisa de Satisfação do Cliente 🍦</h1>

        <form method="POST" action="Cadastro.jsp">

            <label>Id do cliente:</label>
            <input type="text" name="id">

            <label>Nome do cliente:</label>
            <input type="text" name="nome">

            <label>Email:</label>
            <input type="text" name="email">

            <p>1. Como você classifica nosso atendimento?</p>
            <label><input type="radio" name="r1" value="1"> 1</label><br>
            <label><input type="radio" name="r1" value="2"> 2</label><br>
            <label><input type="radio" name="r1" value="3"> 3</label><br>
            <label><input type="radio" name="r1" value="4"> 4</label><br>
            <label><input type="radio" name="r1" value="5"> 5</label><br><br>

            <p>2. Como você avalia a pontualidade do técnico que lhe atendeu?</p>
            <label><input type="radio" name="r2" value="1"> 1</label><br>
            <label><input type="radio" name="r2" value="2"> 2</label><br>
            <label><input type="radio" name="r2" value="3"> 3</label><br>
            <label><input type="radio" name="r2" value="4"> 4</label><br>
            <label><input type="radio" name="r2" value="5"> 5</label><br><br>

            <p>3. Como foi a espera no atendimento?</p>
            <label><input type="radio" name="r3" value="1"> 1</label><br>
            <label><input type="radio" name="r3" value="2"> 2</label><br>
            <label><input type="radio" name="r3" value="3"> 3</label><br>
            <label><input type="radio" name="r3" value="4"> 4</label><br>
            <label><input type="radio" name="r3" value="5"> 5</label><br><br>

            <p>4. Como recomendaria nossa sorveteria a um conhecido?</p>
            <label><input type="radio" name="r4" value="1"> 1</label><br>
            <label><input type="radio" name="r4" value="2"> 2</label><br>
            <label><input type="radio" name="r4" value="3"> 3</label><br>
            <label><input type="radio" name="r4" value="4"> 4</label><br>
            <label><input type="radio" name="r4" value="5"> 5</label><br><br>

            <input type="submit" value="🍨 ENVIAR RESPOSTAS 🍨">
        </form>

    </div>

</body>
</html>
